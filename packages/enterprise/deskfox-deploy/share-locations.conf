# Install snippets under /etc/nginx/snippets/deskfox-share/.
# ^~ is required: the website's generic asset regex must not intercept framework assets.
location = /api/share { include snippets/deskfox-share/share-dynamic.conf; }
location ^~ /api/share/ { include snippets/deskfox-share/share-dynamic.conf; }
location ^~ /share/ { include snippets/deskfox-share/share-dynamic.conf; }
location ^~ /share-assets/ { include snippets/deskfox-share/share-proxy.conf; }
location ^~ /_build/ { include snippets/deskfox-share/share-proxy.conf; }
location = /_server { include snippets/deskfox-share/share-dynamic.conf; }
location ^~ /_server/ { include snippets/deskfox-share/share-dynamic.conf; }
